services:
  notoons:
    image: notoons:v0.1
    container_name: notoons
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PUID=${UID:-1000}
      - PGID=${GID:-1000}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: /opt/notoons/config
        target: /app/notoons/config
        read_only: true
      - type: bind
        source: /opt/notoons/outputs
        target: /app/notoons/outputs
      - type: bind
        source: /opt/notoons/logs
        target: /app/notoons/logs
      - type: bind
        source: /opt/notoons/temp
        target: /app/notoons/temp